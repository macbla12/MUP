name: Build Heston report

on:
  push:
    branches: [main, master]
    paths:
      - "Heston.ipynb"
      - ".github/workflows/heston-report.yml"
  pull_request:
    paths:
      - "Heston.ipynb"
      - ".github/workflows/heston-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-report:
    name: Render Heston PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib numba pympdata jupyter ipykernel

      - name: Install Quarto
        run: |
          QUARTO_VERSION=$(curl -fsSL \
            https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')

          test -n "$QUARTO_VERSION" && test "$QUARTO_VERSION" != "null"

          curl -fsSL \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb" \
            -o quarto.deb

          sudo dpkg -i quarto.deb
          rm quarto.deb
          quarto --version

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            fonts-lmodern \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-polish \
            latexmk

      - name: Verify Python dependencies
        run: |
          python -c "import numpy, scipy, matplotlib, numba, PyMPDATA"
          python -m ipykernel --version

      - name: Render PDF
        env:
          NUMBA_THREADING_LAYER: workqueue
          MPLBACKEND: Agg
        run: quarto render Heston.ipynb --to pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: heston-report-pdf
          path: Heston_sprawozdanie.pdf
          if-no-files-found: error
          retention-days: 30
