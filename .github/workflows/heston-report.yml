name: Build Heston PDF

on:
  push:
    branches: [main, master]
    paths:
      - "Heston.ipynb"
      - ".github/workflows/heston-report.yml"
  pull_request:
    paths:
      - "Heston.ipynb"
      - ".github/workflows/heston-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-report:
    name: Render Heston PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib numba pympdata jupyter ipykernel open-atmos-jupyter-utils

      - name: Install Quarto
        run: |
          QUARTO_VERSION=$(curl -fsSL \
            https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')

          echo "Installing Quarto version: $QUARTO_VERSION"

          test -n "$QUARTO_VERSION" && test "$QUARTO_VERSION" != "null"

          curl -fsSL \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb" \
            -o quarto.deb

          sudo dpkg -i quarto.deb
          rm quarto.deb

          quarto --version

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            fonts-lmodern \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-polish \
            latexmk

      # Move Quarto front matter to the first Markdown cell and remove
      # the Colab badge and notebook-side pip command.
      - name: Prepare notebook for PDF rendering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Heston.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          front_matter = r'''---
          title: "Czy metoda MPDATA pozwala poprawnie wycenić europejską opcję call w modelu Hestona, i jak wariancja wpływa na jej cenę?"
          lang: pl
          date: today
          format:
            pdf:
              documentclass: article
              fontsize: 10pt
              fig-format: svg
              fig-dpi: 300
              fig-width: 10
              fig-height: 3
              geometry: margin=1.8cm
              pdf-engine: xelatex
              fig-align: center
              include-in-header:
                text: |
                  \usepackage{amsmath}
                  \usepackage{fontspec}
                  \setmainfont{Latin Modern Roman}
                  \usepackage{titling}
                  \setlength{\droptitle}{-2em}
          execute:
            echo: false
            warning: false
            message: false
            freeze: false
          jupyter: python3
          ---
          '''

          cells = notebook.get("cells", [])
          if not cells:
              raise SystemExit("Heston.ipynb nie zawiera żadnych komórek.")

          first = cells[0]
          if first.get("cell_type") == "markdown":
              source = "".join(first.get("source", []))
              source = "\n".join(
                  line for line in source.splitlines()
                  if "colab.research.google.com" not in line
                  and "colab-badge" not in line
              ).strip()
              first["source"] = [front_matter + ("\n\n" + source if source else "")]
          else:
              cells.insert(0, {
                  "cell_type": "markdown",
                  "metadata": {},
                  "source": [front_matter]
              })

          cells = [
              cell for cell in cells
              if not (
                  cell.get("cell_type") == "raw"
                  and "---" in "".join(cell.get("source", []))
                  and "execute:" in "".join(cell.get("source", []))
              )
          ]

          for cell in cells:
              if cell.get("cell_type") == "code":
                  source = "".join(cell.get("source", []))
                  source = "\n".join(
                      line for line in source.splitlines()
                      if line.strip() not in (
                          "!pip install pympdata",
                          "%pip install pympdata"
                      )
                  )
                  cell["source"] = source.splitlines(keepends=True)

          notebook["cells"] = cells
          path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Verify Python dependencies
        run: |
          python -c "import numpy, scipy, matplotlib, numba, PyMPDATA"
          python -m ipykernel --version
          quarto --version

      - name: Render PDF
        env:
          NUMBA_THREADING_LAYER: workqueue
          MPLBACKEND: Agg
        run: quarto render Heston.ipynb --to pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: heston-report-pdf
          path: Heston.pdf
          if-no-files-found: error
