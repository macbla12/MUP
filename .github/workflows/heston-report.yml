name: Build Heston PDF

on:
  push:
    branches: [main, master]
    paths:
      - "Heston.ipynb"
      - ".github/workflows/heston-report.yml"
  pull_request:
    paths:
      - "Heston.ipynb"
      - ".github/workflows/heston-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-report:
    name: Render Heston PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib numba pympdata jupyter ipykernel

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "latest"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            fonts-lmodern \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-polish \
            latexmk

      # Move Quarto front matter to the first Markdown cell and remove
      # the Colab badge and notebook-side pip command.
      - name: Prepare notebook for PDF rendering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Heston.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          front_matter = r'''---
          title: "Czy metoda MPDATA pozwala poprawnie wycenić europejską opcję call w modelu Hestona, i jak wariancja wpływa na jej cenę?"
          lang: pl
          date: today
          format:
            pdf:
              documentclass: article
              fontsize: 10pt
              geometry: margin=1.8cm
              pdf-engine: xelatex
              fig-align: center
              include-in-header:
                text: |
                  \usepackage{amsmath}
                  \usepackage{fontspec}
                  \setmainfont{Latin Modern Roman}
                  \usepackage{titling}
                  \setlength{\droptitle}{-2em}
          execute:
            echo: false
            warning: false
            message: false
            freeze: false
          jupyter: python3
          ---
          '''

          cells = notebook.get("cells", [])
          if not cells:
