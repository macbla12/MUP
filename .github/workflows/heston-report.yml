name: Build Heston report

on:
  push:
    branches: [main, master]
    paths:
      - "**.qmd"
      - ".github/workflows/heston-report.yml"
  pull_request:
    paths:
      - "**.qmd"
      - ".github/workflows/heston-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib numba pympdata jupyter ipykernel

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "latest"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended latexmk

      - name: Render PDF
        env:
          NUMBA_THREADING_LAYER: workqueue
          MPLBACKEND: Agg
        run: quarto render sprawozdanie.qmd --to pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: heston-report-pdf
          path: sprawozdanie.pdf
          if-no-files-found: error
          retention-days: 30
