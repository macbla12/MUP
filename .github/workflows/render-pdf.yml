
name: Generate PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat nbclient ipykernel mbclient matplotlib PyMPDATA

      - name: Render all notebooks
        shell: bash
        run: |
          shopt -s nullglob

          notebooks=( *.ipynb )

          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "No notebooks found."
            exit 0
          fi

          for notebook in "${notebooks[@]}"; do
            echo "Rendering: $notebook"
            quarto render "$notebook" --to pdf --execute
          done

      - name: Save PDFs to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          pdfs=( *.pdf )

          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No PDFs generated."
            exit 1
          fi

          git add -- "${pdfs[@]}"

          if ! git diff --cached --quiet; then
            git commit -m "Update generated PDFs"
            git push
          else
            echo "PDFs are already up to date."
          fi
