name: Generate PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat nbclient ipykernel mbclient matplotlib PyMPDATA

      - name: Find changed notebooks
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" \
            | grep -E '\.ipynb$' > changed_notebooks.txt || true

          cat changed_notebooks.txt

      - name: Render changed notebooks
        shell: bash
        run: |
          mkdir -p output

          while IFS= read -r notebook; do
            [ -z "$notebook" ] && continue

            echo "Rendering: $notebook"
            quarto render "$notebook" --to pdf --execute --output-dir output
          done < changed_notebooks.txt

      - name: Save PDFs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/*.pdf

          if ! git diff --cached --quiet; then
            git commit -m "Update generated PDFs"
            git push
          fi
